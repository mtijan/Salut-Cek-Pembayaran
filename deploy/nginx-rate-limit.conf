# Install in /etc/nginx/conf.d/ so these zones are declared inside nginx's http block.
limit_req_zone $binary_remote_addr zone=salut_lookup:10m rate=10r/m;
# Nginx supports r/s and r/m. The application keeps the stricter
# per-IP+email (login) and per-admin (import) windows; this is an edge layer.
limit_req_zone $binary_remote_addr zone=salut_login:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=salut_import:10m rate=1r/m;
