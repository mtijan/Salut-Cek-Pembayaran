[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  ".venv",
  ".venv-audit",
  "Frontend-Admin/node_modules",
  "Frontend/admin-dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
follow_imports = "skip"
files = [
  "Backend/app/main.py",
  "Backend/app/domain",
  "Backend/app/openapi.py",
  "Backend/app/repositories",
  "Backend/app/routers",
  "Backend/app/services",
  "Backend/app/use_cases",
  "Backend/app/version.py",
  "Backend/admin_cli.py",
  "Backend/backup_sqlite.py",
  "Backend/check_disk_capacity.py",
  "Backend/db.py",
  "Backend/due_date_backfill.py",
  "Backend/importing",
  "Backend/import_excel.py",
  "Backend/verify_backup.py",
]
