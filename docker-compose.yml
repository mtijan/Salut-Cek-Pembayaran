services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salut-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - DATABASE_URL=/app/Backend/data/salut.sqlite
      - IMPORT_DIR=/app/Backend/data/imports
      - LOOKUP_HASH_SECRET=change-this-to-a-secure-random-secret
      - ADMIN_BOOTSTRAP_EMAIL=admin@example.com
      - ADMIN_BOOTSTRAP_PASSWORD=AdminSecurePassword123!
      - TRUST_PROXY_HEADERS=true
    volumes:
      - salut_data:/app/Backend/data

volumes:
  salut_data:
    driver: local
