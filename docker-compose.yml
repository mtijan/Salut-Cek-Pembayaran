services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salut-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      DATABASE_URL: /app/Backend/data/salut.sqlite
      IMPORT_DIR: /app/Backend/data/imports
      LOOKUP_HASH_SECRET: ${LOOKUP_HASH_SECRET:?Set LOOKUP_HASH_SECRET in the root .env file}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:?Set ADMIN_BOOTSTRAP_EMAIL in the root .env file}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Set ADMIN_BOOTSTRAP_PASSWORD in the root .env file}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    volumes:
      - salut_data:/app/Backend/data

volumes:
  salut_data:
    driver: local
