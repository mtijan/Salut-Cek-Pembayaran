<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UNIVERSITAS TERBUKA SALUT AWWABIN - TANGERANG</title>
    <link rel="stylesheet" href="./styles.css?v=20260808-payment-layout" />
  </head>
  <body>
    <main class="app-shell">
      <section class="lookup-panel" aria-labelledby="page-title">
        <div class="brand-row">
          <img class="brand-mark" src="./Logo Salut.jpeg" alt="Logo SALUT Awwabin" />
          <div>
            <h1 id="page-title">
              <span class="title-kicker">UNIVERSITAS TERBUKA</span>
              <span class="title-main">SALUT AWWABIN</span>
              <span class="title-main">Tangerang - Banten</span>
            </h1>
          </div>
        </div>

        <div class="lookup-intro">
          <p class="eyebrow">Cek Tagihan</p>
        </div>

        <form id="lookup-form" class="lookup-form" autocomplete="off">
          <label for="nim">NIM</label>
          <input id="nim" name="nim" type="text" inputmode="numeric" placeholder="Contoh: 050117077" required />

          <button type="submit" id="submit-button">
            <span class="button-icon" aria-hidden="true">⌕</span>
            <span>Cek Tagihan</span>
          </button>
          <p class="lookup-helper">Masukkan NIM untuk melihat rincian tagihan, status pembayaran, dan panduan pembayaran biaya pendidikan</p>
        </form>

        <p id="form-message" class="form-message" role="status"></p>
      </section>

      <section class="result-panel" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="receipt-visual" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <h2>Data tagihan akan tampil di sini</h2>
        </div>

        <div id="result-state" class="result-state hidden">
          <section class="payment-section student-info" aria-labelledby="student-info-title">
            <div class="student-info-heading">
              <h2 id="student-info-title">Informasi Mahasiswa</h2>
              <span id="payment-status" class="status-pill">Belum lunas</span>
            </div>
            <dl class="info-list">
              <div>
                <dt>NIM</dt>
                <dd id="student-nim">-</dd>
              </div>
              <div>
                <dt>Nama</dt>
                <dd id="student-name">-</dd>
              </div>
              <div>
                <dt>Program Studi</dt>
                <dd id="student-program">-</dd>
              </div>
            </dl>
          </section>

          <div id="bill-list" class="bill-list"></div>
        </div>
      </section>
    </main>

    <template id="bill-template">
      <article class="bill-item">
        <section class="payment-section bill-info">
          <div class="bill-info-heading">
            <h2 class="bill-section-title">Informasi Tagihan</h2>
            <p class="bill-period"><span>Periode Pembayaran</span><strong class="payment-period-inline">-</strong></p>
          </div>
          <div class="amount-lines"></div>
          <div class="total-bill-row">
            <div>
              <p class="label-small">Total Tagihan</p>
              <h3 class="total-amount"></h3>
            </div>
            <div class="due-date-box hidden">
              <p class="label-small">Batas Aktif Pembayaran</p>
              <p class="due-date-value">-</p>
            </div>
          </div>
        </section>

        <section class="payment-section va-section">
          <h2>Nomor BRIVA</h2>
          <div class="va-list"></div>
        </section>

        <div class="payment-box">
          <div>
            <p class="label-small">Nama Rekening BRIVA</p>
            <p class="account-name"></p>
          </div>
        </div>

        <section class="payment-section payment-instructions">
          <h2>Petunjuk Pembayaran</h2>
          <ul>
            <li>Datang ke Kantor SALUT Awwabin.</li>
            <li>Transfer ke Bank BRI dengan Nomor Rekening BRIVA di atas. Pastikan nama penerima dan nominal pembayaran sudah benar.</li>
            <li>Lihat rincian tagihan melalui Aplikasi Smart BRI Billing (SBB).</li>
            <li>Pembayaran dapat dilakukan dari berbagai bank, ATM, mobile banking, internet banking, atau kanal pembayaran digital lainnya.</li>
            <li>Biaya Pendidikan dapat dicicil sesuai kemampuan dan wajib lunas sebelum batas akhir pembayaran.</li>
          </ul>
        </section>
      </article>
    </template>

    <script src="./app.js?v=20260813-partial-status"></script>
  </body>
</html>
