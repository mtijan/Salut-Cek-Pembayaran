name: Public repository boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Reject private or runtime paths
        run: python scripts/check_public_repo_boundary.py

      - name: Test boundary rules
        run: python -m unittest scripts.test_public_repo_boundary
