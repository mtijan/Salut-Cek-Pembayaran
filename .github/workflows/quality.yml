name: Application quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend and quality dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python dependency lock contract
        run: python scripts/quality/check_python_dependency_locks.py

      - name: Lint Python
        run: python -m ruff check Backend scripts

      - name: Check Python formatting
        run: python -m ruff format --check Backend scripts

      - name: Type-check modular Python boundaries
        run: python -m mypy

      - name: Compile Python
        run: python -m compileall -q Backend scripts

      - name: Check backend test inventory
        run: python scripts/quality/check_backend_test_inventory.py

      - name: Run backend tests
        run: python -m unittest discover -s Backend -t . -p "test_*.py"

      - name: Run public-boundary regression tests
        run: python -m unittest scripts.security.test_public_repo_boundary

      - name: Check public repository boundary
        run: python scripts/security/check_public_repo_boundary.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend-Admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend-Admin/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend-Admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend runtime dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend-Admin/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build synthetic-test bundle
        run: npm run build

      - name: Run synthetic browser flows
        run: npm run test:browser

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-diagnostics
          path: Frontend-Admin/test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
