name: Application quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend and quality dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check Backend scripts

      - name: Type-check modular Python boundaries
        run: mypy

      - name: Compile Python
        run: python -m compileall -q Backend scripts

      - name: Run backend tests
        run: python -m unittest Backend.test_core Backend.test_database_lifecycle Backend.test_operations Backend.test_version Backend.test_domain Backend.test_lookup scripts.test_public_repo_boundary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend-Admin
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend-Admin/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=high
